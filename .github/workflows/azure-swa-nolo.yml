name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # "Publicar en los sitios" desde el CRM (POST /api/portfolio/publish):
  # repository_dispatch corre SIEMPRE sobre el branch default (main) y rebuildea
  # el sitio con el portafolio actual del CRM (vía el prebuild).
  repository_dispatch:
    types: [portfolio-updated]
  # Disparo manual: permite redesplegar sin tener que hacer un commit
  # (p. ej. si un push no llegó a disparar el workflow, o para reintentar un
  # deploy fallido). El CRM ya lo tenía; los sitios no.
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # El build se hace ACÁ, en el runner, y no dentro del contenedor de SWA.
      # Motivo: Angular 22 exige node ^22.22.3 || ^24.15.0, y con Oryx la versión
      # de Node la elige la imagen de Azure — no la controlamos y cambia sin
      # aviso. Es el mismo patrón que ya usa el CRM (deploy-frontend.yml).
      # `npm run build` dispara el prebuild que baja el portafolio del CRM, así
      # que el repository_dispatch del botón «Publicar en los sitios» sigue
      # funcionando igual.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SOWE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          # Ya viene construido del paso anterior: se publica el dist tal cual.
          app_location: "dist/website/browser"
          api_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SOWE }}
          action: "close"
